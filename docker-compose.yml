# FriRSS — runs the prebuilt image from GHCR.
# Contributors: comment out `image:` and uncomment `build: .` to build from source.
#
# Prepare the data folder once:  mkdir -p frirss-data

services:
  frirss:
    image: ghcr.io/fripix/frirss:latest
    # build: .
    container_name: frirss
    ports:
      - "8080:80"               # host:container — change the host port as needed
    environment:
      - NODE_ENV=production
      - FRIRSS_DATA_DIR=/app/data
      - TZ=Europe/Zurich
      # Identity the Node process runs as. The data directory is adopted
      # on start, so an existing root-owned one keeps working.
      # - PUID=1000
      # - PGID=1000
      # Public base URL — set this behind a reverse proxy (also fixes OIDC redirect URIs)
      # - FRIRSS_BASE_URL=https://frirss.example.com
      # Optional Redis cache (instant loads via stale-while-revalidate)
      # - REDIS_URL=redis://redis:6379
      # - CACHE_SYNC_INTERVAL=15
      # Reach FreshRSS directly over the internal network instead of its public URL
      # - PROXY_REWRITES=https://rss.example.com=http://freshrss:80
      # Obsidian bridge (fork): write quotes + saved articles into a mounted vault
      # - OBSIDIAN_VAULT_DIR=/obsidian-vault
      # - OBSIDIAN_QUOTES_FILE=!! Inbox !!/Quotes/Reading Highlights.md
      # - OBSIDIAN_SAVE_DIR=!! Inbox !!/ReadItLater
      # Paywall cookies for full-text extraction: [{ "domain", "cookies" }]
      # - EXTRACT_COOKIES_FILE=/app/data/extract-cookies.json
    volumes:
      - ./frirss-data:/app/data  # SQLite DB persisted here
      # - /path/to/ObsidianVault:/obsidian-vault
    restart: unless-stopped
